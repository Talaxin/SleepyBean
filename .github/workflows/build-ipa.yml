name: Build SleepyBean IPA

on:
  push:
    branches: [main, master]
    paths:
      - "BabySleepTracker/**"
      - "Shared/**"
      - "SleepyBeanWidgets/**"
      - "feather/**"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          MARKETING_VERSION=$(grep -m1 'MARKETING_VERSION = ' BabySleepTracker/BabySleepTracker.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//')
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          FULL_VERSION="${MARKETING_VERSION}.${BUILD_NUMBER}"
          echo "marketing=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${FULL_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync app icon into asset catalog
        run: bash scripts/sync-app-icon.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        working-directory: BabySleepTracker
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.full }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: bash scripts/build-unsigned-ipa.sh

      - name: Verify IPA metadata
        id: ipa
        run: |
          chmod +x scripts/read-ipa-metadata.sh scripts/validate-ipa.sh
          eval "$(scripts/read-ipa-metadata.sh BabySleepTracker/build/SleepyBean.ipa)"
          scripts/validate-ipa.sh BabySleepTracker/build/SleepyBean.ipa
          echo "Verified IPA version ${full_version}, bundle ${bundle_id}, has_icon=${has_icon}"
          if [[ "$marketing_version" != "${{ steps.version.outputs.full }}" ]]; then
            echo "ERROR: IPA short version mismatch (got $marketing_version, expected ${{ steps.version.outputs.full }})" >&2
            exit 1
          fi

      - name: Update Feather repo manifest from IPA
        env:
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: bash scripts/update-feather-repo.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SleepyBean ${{ steps.version.outputs.full }}
          body: |
            SleepyBean ${{ steps.version.outputs.full }}

            - App icon and version ${{ steps.version.outputs.full }} embedded in IPA
            - Build ${{ steps.version.outputs.build }}

            **Feather source URL:**
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/feather/app-repo.json
            ```
          files: BabySleepTracker/build/SleepyBean.ipa
          make_latest: true
          generate_release_notes: true

      - name: Commit updated Feather manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feather/app-repo.json
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi
          git commit -m "Update Feather repo manifest for ${{ steps.version.outputs.full }}"
          git push

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepyBean-ipa
          path: BabySleepTracker/build/SleepyBean.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          eval "$(scripts/read-ipa-metadata.sh BabySleepTracker/build/SleepyBean.ipa)"
          echo "### SleepyBean IPA published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${full_version}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bundle ID:** ${bundle_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Icon in IPA:** ${has_icon}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh BabySleepTracker/build/SleepyBean.ipa >> "$GITHUB_STEP_SUMMARY"
